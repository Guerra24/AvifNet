name: Nightly
on: 
  push:
    branches:
    - master
jobs:
  libavif:
    name: Build libavif
    runs-on: windows-2025
    permissions:
      contents: read
    strategy:
      matrix:
        arch: [x64-windows]
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-depth: 2
    - name: Install nasm
      uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b
    - name: Set up meson
      run: pip install meson
      shell: bash
    - name: Build libavif
      run: |
        .\Build.ps1 ${{ matrix.arch }} .\libavif\
    - name: Upload dlls
      uses: actions/upload-artifact@v7
      with:
        name: libavif-${{ matrix.arch }}
        compression-level: 0
        path: |
          libavif/build-${{ matrix.arch }}/Release/*.dll
  packNatives:
    name: Natives nuget
    runs-on: windows-2025
    needs: libavif
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Download libavif
      uses: actions/download-artifact@v8
      with:
        path: libavif-dll
        pattern: libavif-*
    - name: Publish nuget
      run: |
        Get-ChildItem -Path .\libavif-dll\*.dll -File -Recurse | Move-Item -Destination .\AvifNet.Natives\runtimes\win-x64\native
        nuget pack .\AvifNet.Natives\Package.nuspec
    - name: Upload nuget
      uses: actions/upload-artifact@v7
      with:
        name: AvifNet.Natives
        path: |
          *.nupkg
  buildBindings:
    name: Build bindings nuget
    runs-on: windows-2025
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        fetch-tags: true
    - name: Install .NET SDK
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Prepare Env
      uses: microsoft/setup-msbuild@v3
    - name: Login nuget
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ github.actor }}
    - name: Publish nuget
      run: |
        dotnet pack AvifNet\AvifNet.csproj --configuration Release -p:ContinuousIntegrationBuild=true -p:Deterministic=true
        dotnet nuget push "$(Get-ChildItem AvifNet\bin\Release\*.nupkg)" -k ${{ steps.login.outputs.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json
    - name: Upload nuget
      uses: actions/upload-artifact@v7
      with:
        name: AvifNet
        path: |
          AvifNet/bin/Release/*.nupkg
          AvifNet/bin/Release/*.snupkg