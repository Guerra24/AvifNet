name: Nightly
on: 
  push:
    branches:
    - master
jobs:
  libavif:
    name: Build libavif
    runs-on: windows-2025
    permissions:
      contents: read
    strategy:
      matrix:
        arch: [x64-windows, arm64-windows]
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-depth: 2
    - name: Build libavif
      run: |
        .\Build.ps1 ${{ matrix.arch }} .\libavif\
    - name: Upload dlls
      uses: actions/upload-artifact@v7
      with:
        name: libavif-${{ matrix.arch }}
        compression-level: 0
        path: |
          libavif/build-${{ matrix.arch }}/Release/*.dll
  packNatives:
    name: Natives nuget
    runs-on: windows-2025
    needs: libavif
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Download libavif
      uses: actions/download-artifact@v8
      with:
        path: libavif-dll
    - name: Publish nuget
      run: |
        Get-ChildItem -Path .\libavif-dll\libavif-x64-windows\*.dll -File -Recurse | Move-Item -Destination .\AvifNet.Natives\runtimes\win-x64\native
        Get-ChildItem -Path .\libavif-dll\libavif-arm64-windows\*.dll -File -Recurse | Move-Item -Destination .\AvifNet.Natives\runtimes\win-arm64\native
        nuget pack .\AvifNet.Natives\Package.nuspec
        dotnet nuget add source --username ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/${{ github.actor }}/index.json"
        dotnet nuget push "$(Get-ChildItem *.nupkg)" -k ${{ secrets.GITHUB_TOKEN }} -s "github"
    - name: Upload nuget
      uses: actions/upload-artifact@v7
      with:
        name: AvifNet.Natives
        path: |
          *.nupkg
  buildBindings:
    name: Build bindings nuget
    runs-on: windows-2025
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true
    - name: Install .NET SDK
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Prepare Env
      uses: microsoft/setup-msbuild@v2
    - name: Publish nuget
      run: |
        dotnet pack AvifNet\AvifNet.csproj --configuration Release -p:ContinuousIntegrationBuild=true -p:Deterministic=true
        dotnet nuget add source --username ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/${{ github.actor }}/index.json"
        dotnet nuget push "$(Get-ChildItem AvifNet\bin\Release\*.nupkg)" -k ${{ secrets.GITHUB_TOKEN }} -s "github"
    - name: Upload nuget
      uses: actions/upload-artifact@v4
      with:
        name: AvifNet
        path: |
          AvifNet/bin/Release/*.nupkg
          AvifNet/bin/Release/*.snupkg